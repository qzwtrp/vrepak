[package]
name = "vrepak_gui"
description = "Native GUI for vrepak with Endpoint Configuration (AES)"
repository.workspace = true
authors.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true

[[bin]]
name = "vrepak-gui"
path = "src/main.rs"

[dependencies]
vrepak = { path = "../vrepak" }
vrepak_endpoint = { path = "../vrepak_endpoint" }
eframe = "0.32"
rfd = "0.15"
open = "5"
serde_json = "1.0"
aes = { workspace = true }
strum = { workspace = true }

# GUI ships via plain cargo/tauri-independent builds, not cargo-dist
[package.metadata.dist]
dist = false
