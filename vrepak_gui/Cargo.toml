[package]
name = "vrepak_gui"
description = "Tauri GUI wrapper for vrepak with Endpoint Configuration (AES)"
repository.workspace = true
authors.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true

[[bin]]
name = "vrepak-gui"
path = "src/main.rs"

[dependencies]
vrepak = { path = "../vrepak" }
vrepak_endpoint = { path = "../vrepak_endpoint" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
aes = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

[build-dependencies]
tauri-build = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# GUI ships via `tauri build`, not cargo-dist
[package.metadata.dist]
dist = false
