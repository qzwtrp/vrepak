[workspace]
resolver = "2"
members = ["vrepak", "vrepak_cli"]

[workspace.package]
repository = "https://github.com/qzwtrp/vrepak"
description = "Unreal Engine .pak file suite in Rust (GUI, CLI, & Lib)"
authors = ["qzwtrp"]
license = "MIT OR Apache-2.0"
version = "0.3.0"
edition = "2024"
keywords = ["unreal-engine", "pak", "unrealpak"]

[workspace.dependencies]
aes = "0.8.4"
base64 = "0.22.1"
strum = { version = "0.27", features = ["derive"] }
sha1 = "0.10"
hex = "0.4"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
